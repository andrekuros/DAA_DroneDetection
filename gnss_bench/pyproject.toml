[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gnss-bench"
version = "0.1.0"
description = "Lockstep Cosys-AirSim + PX4 GNSS-denied navigation testbed"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "opencv-python",
    "mavsdk",
    "cosysairsim",
]

[project.scripts]
gnss-bench = "gnss_bench.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gnss_bench*"]
